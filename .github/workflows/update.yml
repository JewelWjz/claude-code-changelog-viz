name: Build & deploy changelog visualizer

on:
  schedule:
    # 13:00 Asia/Shanghai (UTC+8)  ==  05:00 UTC
    # Edit this if your team is in a different timezone.
    - cron: '0 5 * * *'
  workflow_dispatch: {}        # manual run from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: write     # we commit translations.json cache back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: python3 scripts/build.py

      - name: Persist translation cache (if changed)
        run: |
          if [[ -n "$(git status --porcelain translations.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add translations.json
            git commit -m "Update translations cache [skip ci]"
            git push
          else
            echo "translations.json unchanged"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
